apiVersion: apps/v1
kind: Deployment
metadata:
  name: environmental-platform
  labels:
    app: environmental-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: environmental-platform
  template:
    metadata:
      labels:
        app: environmental-platform
    spec:
      containers:
        - name: api
          image: environmental-platform:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-secrets
                  key: url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secrets
                  key: secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "125m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: environmental-platform
spec:
  selector:
    app: environmental-platform
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
